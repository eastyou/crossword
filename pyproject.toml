[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crossword"
version = "0.1.0"
description = "填字游戏生成器：词条 CSV 自动交叉排版，输出可打印题面与答案"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["crossword", "puzzle", "classroom", "printable", "teacher", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
crossword = "crossword.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/crossword"
Source = "https://github.com/eastyou/crossword"

[tool.setuptools]
packages = ["crossword"]
